name: mirea_sanctum
description: Heart of magic, your family's digital sanctuary
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.1
  google_fonts: ^6.1.0
  intl: ^0.18.0
  uuid: ^4.2.1
  flutter_local_notifications: ^16.1.0
  table_calendar: ^3.0.9
  fl_chart: ^0.65.0
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  supabase_flutter: ^2.17.2
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/avatars/
